version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gigflow-app:latest
    container_name: gigflow_runtime
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gigflow_network

networks:
  gigflow_network:
    driver: bridge
